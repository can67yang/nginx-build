name: Build nginx with BoringSSL

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'nginx version (e.g. 1.30.0) — leave empty for auto-detect latest'
        required: false
        default: ''
      boringssl_commit:
        description: 'BoringSSL commit/branch/tag'
        required: true
        default: 'main'
      publish_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false

env:
  BORINGSSL_COMMIT: ${{ inputs.boringssl_commit || 'main' }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      nginx_version: ${{ steps.resolve.outputs.nginx_version }}
    steps:
      - name: Resolve nginx version
        id: resolve
        run: |
          if [ -n "${{ inputs.nginx_version }}" ]; then
            echo "nginx_version=${{ inputs.nginx_version }}" >> "$GITHUB_OUTPUT"
            echo "Using user-specified version: ${{ inputs.nginx_version }}"
          else
            echo "Fetching latest stable nginx version..."
            LATEST=$(curl -sS https://nginx.org/en/download.html \
              | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+' \
              | head -1)
            LATEST="${LATEST:-1.30.0}"
            echo "nginx_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Latest stable: $LATEST"
          fi

  build:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - debian:12
          - debian:13

    container:
      image: ${{ matrix.target }}
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Build nginx with BoringSSL
        env:
          NGINX_VERSION: ${{ needs.resolve-version.outputs.nginx_version }}
          BORINGSSL_COMMIT: ${{ env.BORINGSSL_COMMIT }}
        run: bash build-nginx.sh
        shell: bash

      - name: Build brutal-nginx dynamic module
        env:
          NGINX_VERSION: ${{ needs.resolve-version.outputs.nginx_version }}
        run: bash build-module-brutal.sh
        shell: bash

      - name: Prepare artifact name
        id: artifact-name
        shell: bash
        run: |
          NAME="${{ matrix.target }}"
          echo "name=${NAME//:/-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nginx-boringssl-${{ steps.artifact-name.outputs.name }}
          path: /tmp/nginx-build/artifact/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NGINX_VER: ${{ needs.resolve-version.outputs.nginx_version }}
        run: |
          TAG_NAME="nginx-${NGINX_VER}-boringssl-$(date +%Y%m%d)"
          gh release create "$TAG_NAME" \
            /tmp/release-artifacts/*/*.deb \
            /tmp/release-artifacts/*/*.sha256 \
            /tmp/release-artifacts/*/*.so \
            --title "nginx ${NGINX_VER} + BoringSSL" \
            --notes "Automated build of nginx ${NGINX_VER} with BoringSSL (${BORINGSSL_COMMIT}) for Debian 12/13.

Includes:
- nginx binary (.deb)
- brutal-nginx dynamic module (.so)"
